name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    needs: [rust, settlement, distribution]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: python3 distribution/package-runtime.py --binary target/release/soapbox --output runtime-out
      - uses: actions/upload-artifact@v4
        with:
          name: soapbox-runtime-linux-x64
          path: |
            runtime-out/*.tar.gz
            runtime-out/runtime.json
            runtime-out/SHA256SUMS
          retention-days: 7
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: rustc --edition 2021 -D warnings distribution/launcher.rs -o launcher-check
  settlement:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settlement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: settlement/package-lock.json
      - run: npm ci
      - run: npm test
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test distribution/*.test.mjs
      - run: python3 scripts/test-wsl-service.py
      - run: bash -n scripts/start-container-engine.sh scripts/soapbox-docker-service
